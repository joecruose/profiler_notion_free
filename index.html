<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Health Calculator | Free</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* DEFAULT MONOCHROME VARIABLES */
    :root {
      --page-bg: transparent; 
      --block-bg: #55534e; 
      --block-border: #4a4843;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.65);
      --accent: #FFFFFF;
      --accent-text: #55534e;
      --font-ui: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: var(--page-bg); display: flex; justify-content: center;
      align-items: center; font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }

    .widget-block {
      background-color: var(--block-bg); 
      border-radius: 24px; padding: 20px; display: flex; flex-direction: column;
      width: 320px; height: 410px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      border: 1px solid var(--block-border);
      position: relative; overflow: hidden;
      transition: all 0.3s ease;
    }

    /* HEADER & TOGGLE */
    .header {
      font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .unit-tabs {
      position: relative; display: flex; 
      background: color-mix(in srgb, var(--text-main) 12%, transparent);
      padding: 4px; border-radius: 12px; width: 110px;
    }

    .unit-indicator {
      position: absolute; top: 4px; bottom: 4px; width: calc(50% - 4px);
      background: var(--text-main); border-radius: 8px;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0;
    }

    .unit-btn {
      flex: 1; position: relative; z-index: 1; background: transparent; border: none;
      color: var(--text-muted); padding: 4px 0; font-family: var(--font-ui);
      font-size: 11px; font-weight: 700; cursor: pointer; transition: color 0.3s ease;
      text-transform: uppercase;
    }

    .unit-btn:hover { color: color-mix(in srgb, var(--text-main) 80%, transparent); }
    .unit-btn.active { color: var(--accent-text); cursor: default; }

    /* FORM STYLES */
    #form-view {
      display: flex; flex-direction: column; gap: 9px; height: 100%;
      animation: fadeUp 0.3s ease forwards;
    }

    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; gap: 10px; width: 100%; }
    .row .input-group { flex: 1; }

    label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

    input, select {
      background: color-mix(in srgb, var(--text-main) 6%, transparent); border: 1px solid transparent;
      color: var(--text-main); border-radius: 10px; padding: 8px 12px;
      font-family: inherit; font-size: 13px; font-weight: 600; width: 100%;
      transition: all 0.2s ease; outline: none;
    }

    input:focus, select:focus { 
      border-color: color-mix(in srgb, var(--text-main) 15%, transparent); 
      background: color-mix(in srgb, var(--text-main) 10%, transparent); 
    }
    
    select { 
      appearance: none; 
      cursor: pointer; 
      color-scheme: light;
    }
    
    select option {
      background-color: #FFFFFF;
      color: #272727;
      font-weight: 600;
    }

    .calc-btn {
      margin-top: auto; background: var(--accent); color: var(--accent-text); 
      border: none; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: transform 0.15s ease, opacity 0.2s ease;
    }
    .calc-btn:active { transform: scale(0.96); }
    .calc-btn:hover { opacity: 0.9; }

    /* RESULTS VIEW */
    #results-view {
      display: none; flex-direction: column; gap: 10px; height: 100%;
      animation: fadeUp 0.3s ease forwards;
    }

    .btn-icon-back {
      background: color-mix(in srgb, var(--text-main) 6%, transparent); border: none; color: var(--text-main);
      width: 32px; height: 32px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
    }
    .btn-icon-back:hover { background: color-mix(in srgb, var(--text-main) 15%, transparent); }
    .btn-icon-back svg { width: 14px; height: 14px; fill: currentColor; }

    .macros-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; flex: 1; position: relative; }
    
    .macro-box {
      background: color-mix(in srgb, var(--text-main) 4%, transparent); border-radius: 12px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 2px; justify-content: center;
    }
    .macro-box.primary { grid-column: span 2; background: color-mix(in srgb, var(--text-main) 8%, transparent); flex-direction: row; align-items: center; justify-content: space-between; }
    
    .m-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .m-val { font-size: 16px; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums; }
    .m-sub { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .primary .m-val { font-size: 24px; }

    /* BLURRED PAYWALL CONTAINER FOR MACROS */
    .paywall-section {
      grid-column: span 2; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      position: relative; border-radius: 12px; overflow: hidden;
    }

    .paywall-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: color-mix(in srgb, var(--block-bg) 65%, transparent);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: var(--text-main); font-size: 12px; font-weight: 700;
      text-decoration: none; border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--text-main) 20%, transparent);
      transition: all 0.2s ease; cursor: pointer; z-index: 10;
      padding: 8px 12px; text-align: center;
    }

    .paywall-overlay:hover {
      background: color-mix(in srgb, var(--block-bg) 50%, transparent);
      border-color: var(--text-main);
      transform: scale(0.99);
    }

    .paywall-overlay svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  </style>
</head>
<body>

  <div class="widget-block">
    
    <!-- INPUT FORM -->
    <div id="form-view">
      <div class="header">
        Health Profiler
        <div class="unit-tabs">
          <div class="unit-indicator" id="unit-slider"></div>
          <button class="unit-btn active" id="btn-imp" onclick="setUnit('imp', 0)">US</button>
          <button class="unit-btn" id="btn-met" onclick="setUnit('met', 1)">Metric</button>
        </div>
      </div>
      
      <div class="row">
        <div class="input-group">
          <label>Gender</label>
          <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="input-group">
          <label>Age</label>
          <input type="number" id="age" value="22" min="15" max="100">
        </div>
      </div>

      <div class="row">
        <div class="input-group">
          <label id="lbl-weight">Weight (lbs)</label>
          <input type="number" id="weight" value="132" min="30" max="600">
        </div>
        <div class="input-group">
          <label id="lbl-height">Height (in)</label>
          <input type="number" id="height" value="67" min="40" max="100">
        </div>
      </div>

      <div class="input-group">
        <label>Activity Level</label>
        <select id="activity">
          <option value="1.2">Sedentary (Little to no exercise)</option>
          <option value="1.375">Lightly Active (1–2 days per week)</option>
          <option value="1.55" selected>Moderately Active (3–5 days per week)</option>
          <option value="1.725">Very Active (6–7 days per week)</option>
        </select>
      </div>

      <div class="input-group">
        <label>Fitness Goal</label>
        <select id="goal">
          <option value="maintain" selected>Maintain Weight</option>
          <option value="cut">Fat Loss (Cut)</option>
          <option value="bulk">Muscle Gain (Bulk)</option>
        </select>
      </div>

      <button class="calc-btn" onclick="calculate()">Generate Profile</button>
    </div>

    <!-- RESULTS DASHBOARD -->
    <div id="results-view">
      <div class="header" style="margin-bottom: 4px;">
        <button class="btn-icon-back" onclick="goBack()" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <span>Your Targets</span>
      </div>

      <div class="macros-grid">
        <div class="macro-box primary">
          <div style="display:flex; flex-direction:column;">
            <span class="m-label" id="res-cal-label">Calorie Target</span>
            <span class="m-sub" id="res-cal-sub">Daily Calories</span>
          </div>
          <span class="m-val" id="res-tdee">0</span>
        </div>

        <div class="macro-box">
          <span class="m-label">BMI Score</span>
          <span class="m-val" id="res-bmi">0.0</span>
          <span class="m-sub" id="res-bmi-cat">Normal</span>
        </div>

        <div class="macro-box">
          <span class="m-label">Water Target</span>
          <span class="m-val" id="res-water">0</span>
          <span class="m-sub" id="res-water-sub">Daily Intake</span>
        </div>

        <!-- PAYWALLED MACRO BREAKDOWN -->
        <div class="paywall-section">
          <div class="macro-box">
            <span class="m-label">Protein</span>
            <span class="m-val">125g</span>
          </div>
          <div class="macro-box">
            <span class="m-label">Fats</span>
            <span class="m-val">55g</span>
          </div>
          <div class="macro-box primary" style="grid-column: span 2; padding: 10px 12px;">
            <span class="m-label">Carbs</span>
            <span class="m-val" style="font-size: 18px;">210g</span>
          </div>

          <a href="https://joecruose.gumroad.com/l/profiler_widget" target="_blank" class="paywall-overlay" title="Unlock Macro Breakdown in Pro">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <span>Unlock Macros in Pro</span>
          </a>
        </div>

      </div>
    </div>

  </div>

  <script>
    const notionColors = [
      { l: '55534e', d: 'd4d4d4' },
      { l: 'a6a299', d: '7f7f7f' },
      { l: '9f6b53', d: 'ac775f' },
      { l: 'cb912f', d: 'c98c1d' },
      { l: 'd9730d', d: 'd9771e' },
      { l: '448361', d: '2a9961' },
      { l: '337ea9', d: '277be5' },
      { l: '9065b0', d: '8f5cc1' },
      { l: 'c14c8a', d: 'c74177' },
      { l: 'd44c47', d: 'cc4745' }
    ];

    let currentUnit = 'imp';

    /* --- DECODING & INJECTION --- */
    function initializeWidget() {
      const urlParams = new URLSearchParams(window.location.search);
      const t = parseInt(urlParams.get('t')); 
      const m = urlParams.get('m'); 
      const c = urlParams.get('c'); 
      const u = urlParams.get('u'); 

      const root = document.documentElement;

      if (!isNaN(t) && t >= 0 && t < notionColors.length) {
        const hex = m === 'd' ? notionColors[t].d : notionColors[t].l;
        const textHex = c === 'b' ? '272727' : 'FFFFFF';
        
        root.style.setProperty('--block-bg', `#${hex}`);
        root.style.setProperty('--text-main', `#${textHex}`);
        root.style.setProperty('--accent', `#${textHex}`);
        root.style.setProperty('--accent-text', `#${hex}`);
        root.style.setProperty('--text-muted', `color-mix(in srgb, #${textHex} 65%, transparent)`);
        root.style.setProperty('--block-border', `color-mix(in srgb, #${textHex} 15%, #${hex})`);
      }

      if (m === 'd') {
        root.style.setProperty('--page-bg', '#191919');
      } else {
        root.style.setProperty('--page-bg', 'transparent');
      }

      if (u === 'met') {
        setUnit('met', 1);
      }
    }

    function setUnit(unit, index) {
      if (currentUnit === unit && document.getElementById(`btn-${unit}`).classList.contains('active')) return;
      currentUnit = unit;
      
      document.getElementById('unit-slider').style.transform = `translateX(${index * 100}%)`;
      document.getElementById('btn-imp').classList.remove('active');
      document.getElementById('btn-met').classList.remove('active');
      document.getElementById(`btn-${unit}`).classList.add('active');

      const wInput = document.getElementById('weight');
      const hInput = document.getElementById('height');

      if (unit === 'imp') {
        document.getElementById('lbl-weight').innerText = 'Weight (lbs)';
        document.getElementById('lbl-height').innerText = 'Height (in)';
        wInput.value = Math.round(wInput.value * 2.20462) || 132;
        hInput.value = Math.round(hInput.value / 2.54) || 67;
      } else {
        document.getElementById('lbl-weight').innerText = 'Weight (kg)';
        document.getElementById('lbl-height').innerText = 'Height (cm)';
        wInput.value = Math.round(wInput.value / 2.20462) || 60;
        hInput.value = Math.round(hInput.value * 2.54) || 170;
      }
    }

    function calculate() {
      let rawW = parseFloat(document.getElementById('weight').value);
      let rawH = parseFloat(document.getElementById('height').value);
      const a = parseInt(document.getElementById('age').value);
      const g = document.getElementById('gender').value;
      const act = parseFloat(document.getElementById('activity').value);
      const goal = document.getElementById('goal').value;

      if(!rawW || !rawH || !a) return;

      const w = currentUnit === 'imp' ? rawW / 2.20462 : rawW;
      const h = currentUnit === 'imp' ? rawH * 2.54 : rawH;

      const hMeters = h / 100;
      const bmi = (w / (hMeters * hMeters)).toFixed(1);
      
      let category = "Normal";
      if (bmi < 18.5) category = "Underweight";
      else if (bmi >= 25 && bmi < 29.9) category = "Overweight";
      else if (bmi >= 30) category = "Obese";

      let bmr = (10 * w) + (6.25 * h) - (5 * a);
      bmr += (g === 'male') ? 5 : -161;

      const tdee = Math.round(bmr * act);
      let targetCalories = tdee;
      let subText = "Maintenance Goal";

      if (goal === "cut") {
        targetCalories = Math.max(1200, tdee - 500); 
        subText = "Fat Loss Goal";
      } else if (goal === "bulk") {
        targetCalories = tdee + 300; 
        subText = "Muscle Gain Goal";
      }

      let waterOutput = "";
      if (currentUnit === 'imp') {
          waterOutput = Math.round(rawW * 0.6) + " oz";
      } else {
          waterOutput = (w * 0.035).toFixed(1) + " L";
      }

      document.getElementById('res-bmi').innerText = bmi;
      document.getElementById('res-bmi-cat').innerText = category;
      document.getElementById('res-cal-sub').innerText = subText;
      document.getElementById('res-tdee').innerText = targetCalories + " kcal";
      document.getElementById('res-water').innerText = waterOutput;

      document.getElementById('form-view').style.display = 'none';
      document.getElementById('results-view').style.display = 'flex';
    }

    function goBack() {
      document.getElementById('results-view').style.display = 'none';
      document.getElementById('form-view').style.display = 'flex';
    }

    window.addEventListener('DOMContentLoaded', initializeWidget);
  </script>
</body>
</html>
